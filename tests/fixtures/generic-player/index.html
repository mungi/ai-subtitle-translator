<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AST generic player fixture</title>
  <link rel="stylesheet" href="../../../extension/content/content-style.css">
  <style>
    body { font: 15px system-ui, sans-serif; margin: 24px; }
    .player { width: 640px; }
    video { display: block; width: 640px; height: 360px; background: #111; }
    /* ?small: a small player that clips its content and restyles spans, like some course sites. */
    .small .player { width: 420px; height: 236px; overflow: hidden; position: relative; }
    .small video { width: 420px; height: 236px; }
    .small .player span { display: inline; width: auto; height: auto; transform: none; }
    .small .player * { font-size: 1.4rem; font-family: Georgia, serif; letter-spacing: 0.2em; }
    /* Like edX: every button restyled. */
    .small button { border-top: 2px solid #fff; border-radius: 8px; font-family: Impact, sans-serif; font-weight: 700; text-shadow: 0 1px 0 #000; text-transform: uppercase; }
    .small button { box-shadow: inset 0 1px 0 0 #254337; border: 1px solid #000; border-bottom: 1px solid #000; color: #fff; background-color: #00262B; background-image: linear-gradient(#0e3a40, #00262B); }
    .small button:hover { background-color: #fff; background-image: none; color: #00262B; }
    .small button:focus, .small button:active { box-shadow: inset 0 0 20px 0 #000; }
  </style>
  <!-- Manual check for the generic video player (technical preview) without loading the extension:
       serve the repository root over http and open /tests/fixtures/generic-player/.
       Extension APIs are stubbed; caption parsing uses the real worker module; translation is a stub. -->
  <script>
    globalThis.__astGenericMode = true;
    const astLog = (globalThis.astFixtureLog = []);
    // Korean UI strings, loaded before the content scripts ask for them.
    const fixtureMessages = (() => {
      const request = new XMLHttpRequest();
      request.open("GET", "../../../extension/_locales/ko/messages.json", false);
      request.send();
      return JSON.parse(request.responseText);
    })();
    const modules = Promise.all([
      import("../../../extension/platforms/generic-captions.js"),
      import("../../../extension/shared/storage.js")
    ]);
    window.chrome = {
      runtime: {
        id: "fixture",
        getURL: (path) => `../../../extension/${path}`,
        connect: () => ({ onDisconnect: { addListener() {} }, disconnect() {} }),
        onMessage: { addListener() {} },
        async sendMessage(message) {
          astLog.push(message.type);
          const [captions, storage] = await modules;
          switch (message.type) {
            case "settings.getPublic":
              return { ok: true, settings: storage.normalizeSettings({ platforms: { generic: true }, targetLanguage: "ko" }) };
            case "settings.getSubtitleEnabled":
              return { ok: true, enabled: true };
            case "captions.generic.parseTranscript":
              return { ok: true, document: captions.parseGenericTranscript(message) };
            case "captions.generic.listHlsTracks":
              return { ok: true, tracks: [] };
            case "translation.translateDocument":
              return { ok: true, document: { ...message.document, cues: message.document.cues.map((cue) => ({ ...cue, text: `[번역] ${cue.text}` })) } };
            default:
              return { ok: false, error: `fixture: ${message.type} is not stubbed` };
          }
        }
      },
      i18n: {
        getMessage: (key, substitutions) => {
          const entry = fixtureMessages[key];
          if (!entry) return key;
          let index = 0;
          return entry.message.replace(/\$[a-z_]+\$/gi, () => [].concat(substitutions ?? [])[index++] ?? "");
        },
        getUILanguage: () => "ko"
      }
    };
  </script>
</head>
<body>
  <h1>Generic player fixture</h1>
  <div class="player">
    <video id="video" muted playsinline>
      <track src="en.vtt" kind="subtitles" srclang="en" label="English">
    </video>
  </div>
  <canvas id="canvas" width="640" height="360" hidden></canvas>
  <script>
    // A live canvas stream gives the video a running clock without a media file.
    const canvas = document.getElementById("canvas");
    const context = canvas.getContext("2d");
    let frame = 0;
    setInterval(() => {
      context.fillStyle = `hsl(${frame++ % 360} 40% 25%)`;
      context.fillRect(0, 0, 640, 360);
    }, 100);
    const video = document.getElementById("video");
    // ?mode=texttrack: captions only as a player text track (no <track> file).
    // ?mode=none: no captions at all; AST must show nothing.
    const mode = new URLSearchParams(location.search).get("mode");
    if (new URLSearchParams(location.search).has("small")) document.body.classList.add("small");
    if (mode === "texttrack" || mode === "none") video.querySelector("track").remove();
    if (mode === "texttrack") {
      const textTrack = video.addTextTrack("subtitles", "English", "en");
      [[0.5, 4, "This line comes from a player text track."], [4, 8, "No caption file was requested."], [8, 60, "Done."]]
        .forEach(([start, end, text]) => textTrack.addCue(new VTTCue(start, end, text)));
    }
    video.srcObject = canvas.captureStream(10);
    video.play().catch(() => {});
  </script>
  <script src="../../../extension/content/phrase-segmentation.js"></script>
  <script src="../../../extension/content/subtitle-export.js"></script>
  <script src="../../../extension/content/generic-player.js"></script>
  <script src="../../../extension/content/content-script.js"></script>
</body>
</html>
